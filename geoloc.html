<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Loc</title>
</head>
<body>
    <!-- This page will ask for location information and then pass it to the API to get geolocation. -->
    <form id="locationForm">
        <label for="city">Enter your city:</label>
        <input type="text" id="city" name="city" required>
        <button type="submit">Get Geolocation</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById("locationForm").addEventListener("submit", function(event) {
            event.preventDefault();
            const city = document.getElementById("city").value;
            fetch(`https://geoapi.info/api/geo?city=${city}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerText = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById("result").innerText = "Error fetching geolocation data.";
                    console.error(error);
                });
        });
    </script>
</body>
</html>
